name: Publish experimental alpha
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag; release notes must disclose unverified remote networking
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/run_rules.py
      - run: powershell.exe -NoProfile -File tests/diagnostics_test.ps1
      - run: cmd /c Build-Native.cmd tests
      - name: Package and publish prerelease
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z.-]{0,60}$') { throw 'Invalid release tag' }
          ./Package-Release.ps1 -Version $env:RELEASE_TAG.Substring(1)
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object FullName)
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --prerelease --latest=false --title "TRMP $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
